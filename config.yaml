appointment_types:
  lesson:
    duration_minutes: 90
    buffer_minutes: 0   # back-to-back per the owner (ride-along 2026-06-10); per-instructor buffer → 999.26
    cancel_notice_days: 1
    # Appended to the confirmation reply after a student confirms a reminder
    # ("Husk at medbringe ... i morgen."). Danish only; keep it a bring-list,
    # not prerequisites (you can't "bring" completed lessons).
    what_to_bring: din lektionsplan og din kørekortansøgning
  manoeuvring:
    duration_minutes: 180
    buffer_minutes: 0   # back-to-back per the owner (ride-along 2026-06-10); per-instructor buffer → 999.26
    cancel_notice_days: 4
    what_to_bring: din lektionsplan og din kørekortansøgning
  test:
    duration_minutes: 60
    buffer_minutes: 0   # back-to-back per the owner (ride-along 2026-06-10); per-instructor buffer → 999.26
    cancel_notice_days: 6
    what_to_bring: >-
      din kørekortansøgning, din lektionsplan, pas eller dåbsattest — og dit
      kørekort hvis du har et

# 999.37 PILOT SEED — content labels for "Kørsel på vej" lektioner.
# Keyed by the OFFICIAL lektionsplan number the student reads off their own plan
# (the one Lisa tells them to check). Road-driving lessons fall at these numbers;
# the gaps (22-25, 30-33, 38-41 etc.) are theory / manøvrebane / køreteknisk and
# have no label here. Used ONLY to nudge the student to verify their position at
# first-booking onboarding — capture + display, never enforcement.
# Source: Example Driving School lektionsplan (Nikolas, 2026-06-14). ⚠️ PROVISIONAL —
# the owner to verify; the exact roundabout/darkness placement can be per-student.
lektionsplan_labels:
  18: igangsætning, standsning og placering
  19: igangsætning, standsning og placering
  20: hastighed, vognbaneskift og baglænskørsel
  21: hastighed, vognbaneskift og baglænskørsel
  26: kørsel forbi holdende og gående, møde
  27: kørsel forbi holdende og gående, møde
  28: overhaling og trafiksanerede områder
  29: overhaling og trafiksanerede områder
  34: vejkryds (ligeud, højre- og venstresving)
  35: vejkryds (ligeud, højre- og venstresving)
  36: rundkørsel
  37: rundkørsel
  42: motorvej, kørsel ved siden af andre og parkering
  43: motorvej, kørsel ved siden af andre og parkering
  44: mørkekørsel, tunnel og letbane
